# Deploys the Studio Milka demo salon site to GitHub Pages.
#
# URL: https://kpopsdeath14.github.io/small-business-sites/
#
# The site source lives in sites/studio-milka (tracked despite the blanket
# sites/*/ gitignore). CI builds it as part of the npm workspace — it must NOT
# re-run `npm run new-site`, because without ANTHROPIC_API_KEY that would overwrite
# the committed generated copy with dry-run placeholder text.
name: Deploy Studio Milka to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "sites/studio-milka/**"
      - "packages/shared-ui/**"
      - "packages/templates/beauty-salon/**"
      - ".github/workflows/deploy-studio-milka.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workspace root)
        run: npm ci

      - name: Build site
        run: npm run build -w site-studio-milka

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/studio-milka/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4